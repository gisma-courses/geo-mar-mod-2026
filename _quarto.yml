project:
  type: website
  output-dir: docs/
  resources:
    - "scripts/*.R"
    - "scripts/*.py"
    - "scripts/requirements-thermik.txt"
  render:
    - "index.qmd"
    - "pages/stadtwaerme-einstieg.qmd"
    - "pages/hotspot-zu-palm.qmd"
    - "pages/modellierung_luftbild_lst.qmd"
    - "pages/qgis-howto-stadtwaerme-marburg.qmd"
    - "pages/exkurs_stationen.qmd"
    - "pages/r-werkzeuge.qmd"
    - "pages/ws/ws-02.qmd"
    - "pages/starkregen-einstieg.qmd"
    - "pages/starkregen-reader.qmd"
    - "pages/starkregen-daten.qmd"
    - "pages/itzi-setup.qmd"

lang: de

website:
  title: "Marburg modellieren"
  bread-crumbs: false
  open-graph: true
  page-navigation: true
  site-url: https://gisma-courses.github.io/geo-mar-mod-2026
  repo-url: https://github.com/gisma-courses/geo-mar-mod-2026
  repo-actions: [edit, issue]
  repo-branch: main

  search:
    location: navbar
    type: textbox

  twitter-card:
    creator: "@gisma"

  comments: false

  sidebar:
    - title: "Marburg modellieren"
      style: "docked"
      collapse-level: 1
      pinned: true
      contents:
        - href: index.qmd
          text: "Kursüberblick"
        - text: "---"
        - section: "1. Stadtklima"
          contents:
            - href: pages/stadtwaerme-einstieg.qmd
              text: "Einstieg und Arbeitsauftrag"
            - href: pages/modellierung_luftbild_lst.qmd
              text: "Modellkonzept: Oberfläche, Umwelt, Mensch"
            - href: pages/exkurs_stationen.qmd
              text: "Modellkritik: UTCI und PET"
            - href: pages/ws/ws-02.qmd
              text: "Worksheet: Thermische Entlastung"
            - href: pages/hotspot-zu-palm.qmd
              text: "Abschluss: Vom Hotspot zur Maßnahme"
            - section: "Werkzeugreferenzen"
              contents:
                - href: pages/qgis-howto-stadtwaerme-marburg.qmd
                  text: "QGIS: Luftbild und LST"
                - href: pages/r-werkzeuge.qmd
                  text: "R: Zeitreihen und Regionen"
        - section: "2. Starkniederschlag (Itzï)"
          contents:
            - href: pages/starkregen-einstieg.qmd
              text: "Einstieg und Arbeitsauftrag"
            - href: pages/starkregen-reader.qmd
              text: "Reader: Wasser im Stadtraum"
            - href: pages/starkregen-daten.qmd
              text: "Daten beschaffen und vorbereiten"
            - href: pages/itzi-setup.qmd
              text: "Itzï beschaffen und einrichten"
        - href: index.qmd#verkehr
          text: "3. Verkehr (NetLogo)"

execute:
  freeze: auto
  echo: false
  message: false
  warning: false
  cache: false

format:
  html:
    include-in-header: css/banner-style.html
    include-after-body: css/course-navigation.html
    code-overflow: wrap
    toc-title: "Inhalt"
    number-sections: false
    highlight-style: github
    theme:
      light: cerulean
      dark: [lumen, css/theme-dark.scss]
    code-copy: true
    code-fold: true
    code-summary: "Code anzeigen"
    css: css/styles.css
    toc: true
    link-external-icon: false
    link-external-newwindow: true
