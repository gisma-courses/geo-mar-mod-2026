<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
<title id="title">Qualitatives Energiebilanzschema einer horizontalen Oberfläche</title><desc id="desc">Nettostrahlung Rn trifft auf die Oberfläche. Fühlbare Wärme H und Verdunstung LE gehen zur Luft. Wärmeleitung G führt ins tiefere Material; S bezeichnet die lokale Speicherung. Pfeile sind nicht quantitativ.</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="context-stroke"/></marker></defs>
<rect width="960" height="420" rx="16" fill="#edf5fa"/><rect x="35" y="250" width="890" height="125" fill="#c7b097"/><path d="M35 250H925" stroke="#485b62" stroke-width="4"/>
<g font-family="sans-serif" fill="#20363e" font-size="20"><text x="45" y="35" font-weight="bold">Eine Bilanz · mehrere Energiepfade</text><text x="45" y="65" font-size="17">Qualitatives Schema: Rₙ = H + LE + G + S</text>
<g stroke-width="9" marker-end="url(#a)"><path d="M150 110V230" stroke="#b87900"/><path d="M395 230V115" stroke="#bc503b"/><path d="M635 230V115" stroke="#127ba1"/><path d="M390 273V348" stroke="#65537b"/></g>
<text x="75" y="96">Rₙ · Nettostrahlung</text><text x="305" y="96">H · fühlbare Wärme</text><text x="565" y="96">LE · Verdunstung</text><text x="505" y="166" font-size="16">Wasser muss</text><text x="505" y="187" font-size="16">verfügbar sein</text>
<text x="70" y="290">Oberfläche / Material</text><text x="425" y="325">G · Wärmeleitung</text><rect x="670" y="280" width="205" height="65" rx="10" fill="#f9eee2" stroke="#7a624f"/><text x="692" y="308">S · Speicherung</text><text x="690" y="331" font-size="16">Erwärmen / Abkühlen</text>
<text x="480" y="402" text-anchor="middle" font-size="15">Pfeilbreiten ohne Zahlenbezug · Bilanzraum festlegen, Speicherung nicht doppelt zählen</text></g></svg>
